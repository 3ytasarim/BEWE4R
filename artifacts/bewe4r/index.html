<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="author" content="BEWE4R" />
    <meta name="theme-color" content="#f4efe3" />
    <meta name="color-scheme" content="light" />

    <!-- Per-page title, description, robots, canonical, Open Graph, Twitter and JSON-LD are written into the
         first HTML of every page at build time (scripts/prerender.mjs from src/seo/*). -->
    <!--seo-head-->

    <!-- Without JavaScript the entrance animations never run: show the prerendered content as is. -->
    <noscript>
      <style>
        #root [style*="opacity:0;"],
        #root [style$="opacity:0"] { opacity: 1 !important; }
        #root [style*="translateY("],
        #root [style*="translateX("],
        #root [style*="rotate("] { transform: none !important; }
      </style>
    </noscript>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (media swap); text shows in a fallback font until they arrive (display=swap) -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Umami analytics (bleibsichtbar) -->
    <link rel="preconnect" href="https://analytics.bleibsichtbar.com" />
    <script defer src="https://analytics.bleibsichtbar.com/script.js" data-website-id="51febfdf-41cf-464b-9ed1-4890faf0772a"></script>
    <script defer src="https://analytics.bleibsichtbar.com/recorder.js" data-website-id="51febfdf-41cf-464b-9ed1-4890faf0772a"></script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>

    <!-- ElevenLabs voice agent — persists across all client-side routes; defaults to bottom-right -->
    <elevenlabs-convai
      agent-id="agent_1401m1hq2pe1ev8bv429xhp7rzp5"
      disable-banner="true"
    ></elevenlabs-convai>
    <script>
      /* Load the widget script after the page has loaded and the browser is idle, so it never competes with LCP. */
      (function () {
        function load() {
          var s = document.createElement("script");
          s.src = "https://unpkg.com/@elevenlabs/convai-widget-embed";
          s.async = true;
          document.body.appendChild(s);
        }
        function whenIdle() {
          if ("requestIdleCallback" in window) window.requestIdleCallback(load, { timeout: 4000 });
          else setTimeout(load, 2000);
        }
        if (document.readyState === "complete") whenIdle();
        else window.addEventListener("load", whenIdle);
      })();
    </script>
    <script>
      /* Re-brand the widget's "Powered by" attribution to Bleibsichtbar (no ElevenLabs flash) */
      (function () {
        var URL = "https://bleibsichtbar.com/";
        var LABEL = "Bleibsichtbar";
        var COLOR = "#0f0f0f";
        // Hide the original attribution until our script swaps it; :has() unhides it
        // automatically the moment the href stops pointing at elevenlabs.io.
        var HIDE_CSS =
          'a[href*="elevenlabs.io"]{opacity:0!important;transition:none!important}' +
          'p:has(a[href*="elevenlabs.io"]){opacity:0!important;transition:none!important}';
        var seen = new WeakSet();
        function inject(root) {
          if (root.__b2bv) return;
          root.__b2bv = true;
          try {
            var s = document.createElement("style");
            s.textContent = HIDE_CSS;
            root.appendChild(s);
          } catch (e) {}
        }
        function brandLink(a) {
          a.setAttribute("href", URL);
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener");
          if (a.textContent !== LABEL) a.textContent = LABEL;
          a.style.setProperty("color", COLOR, "important");
          a.style.setProperty("opacity", "1", "important");
          // Make the whole "Powered by B2b-voice" line solid black, not just the link
          var p = a.closest("p");
          if (p) {
            p.style.setProperty("opacity", "1", "important");
            Array.prototype.forEach.call(p.children, function (child) {
              child.style.setProperty("color", COLOR, "important");
              child.style.setProperty("opacity", "1", "important");
            });
          }
        }
        function rebrand(root) {
          if (!root || !root.querySelectorAll) return;
          inject(root);
          root
            .querySelectorAll('a[href*="elevenlabs.io"], a[href="' + URL + '"]')
            .forEach(brandLink);
          root.querySelectorAll("*").forEach(function (el) {
            if (el.shadowRoot) {
              if (!seen.has(el.shadowRoot)) {
                seen.add(el.shadowRoot);
                new MutationObserver(function () {
                  rebrand(el.shadowRoot);
                }).observe(el.shadowRoot, { childList: true, subtree: true });
              }
              rebrand(el.shadowRoot);
            }
          });
        }
        function tick() {
          var host = document.querySelector("elevenlabs-convai");
          if (host && host.shadowRoot) rebrand(host.shadowRoot);
        }
        tick();
        // Catch the widget within ~50ms of it rendering, then settle to a keep-alive.
        var fast = setInterval(tick, 50);
        setTimeout(function () {
          clearInterval(fast);
        }, 12000);
        setInterval(tick, 1000);
        document.addEventListener("DOMContentLoaded", tick);
      })();
    </script>
  </body>
</html>
