  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ElevenLabs voice agent — persists across all client-side routes; defaults to bottom-right -->
    <elevenlabs-convai
      agent-id="agent_1401m1hq2pe1ev8bv429xhp7rzp5"
      disable-banner="true"
    ></elevenlabs-convai>
    <script
      src="https://unpkg.com/@elevenlabs/convai-widget-embed"
      async
      type="text/javascript"
    ></script>
    <script>
      /* Re-brand the widget's "Powered by" attribution to Bleibsichtbar (no ElevenLabs flash) */
      (function () {
        var URL = "https://bleibsichtbar.com/";
        var LABEL = "Bleibsichtbar";
        var COLOR = "#0f0f0f";
        // Hide the original attribution until our script swaps it; :has() unhides it
        // automatically the moment the href stops pointing at elevenlabs.io.
        var HIDE_CSS =
          'a[href*="elevenlabs.io"]{opacity:0!important;transition:none!important}' +
          'p:has(a[href*="elevenlabs.io"]){opacity:0!important;transition:none!important}';
        var seen = new WeakSet();
        function inject(root) {
          if (root.__b2bv) return;
          root.__b2bv = true;
          try {
            var s = document.createElement("style");
            s.textContent = HIDE_CSS;
            root.appendChild(s);
          } catch (e) {}
        }
        function brandLink(a) {
          a.setAttribute("href", URL);
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener");
          if (a.textContent !== LABEL) a.textContent = LABEL;
          a.style.setProperty("color", COLOR, "important");
          a.style.setProperty("opacity", "1", "important");
          // Make the whole "Powered by B2b-voice" line solid black, not just the link
          var p = a.closest("p");
          if (p) {
            p.style.setProperty("opacity", "1", "important");
            Array.prototype.forEach.call(p.children, function (child) {
              child.style.setProperty("color", COLOR, "important");
              child.style.setProperty("opacity", "1", "important");
            });
          }
        }
        function rebrand(root) {
          if (!root || !root.querySelectorAll) return;
          inject(root);
          root
            .querySelectorAll('a[href*="elevenlabs.io"], a[href="' + URL + '"]')
            .forEach(brandLink);
          root.querySelectorAll("*").forEach(function (el) {
            if (el.shadowRoot) {
              if (!seen.has(el.shadowRoot)) {
                seen.add(el.shadowRoot);
                new MutationObserver(function () {
                  rebrand(el.shadowRoot);
                }).observe(el.shadowRoot, { childList: true, subtree: true });
              }
              rebrand(el.shadowRoot);
            }
          });
        }
        function tick() {
          var host = document.querySelector("elevenlabs-convai");
          if (host && host.shadowRoot) rebrand(host.shadowRoot);
        }
        tick();
        // Catch the widget within ~50ms of it rendering, then settle to a keep-alive.
        var fast = setInterval(tick, 50);
        setTimeout(function () {
          clearInterval(fast);
        }, 12000);
        setInterval(tick, 1000);
        document.addEventListener("DOMContentLoaded", tick);
      })();
    </script>
  </body>
