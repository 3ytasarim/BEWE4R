# BEWE4R - nginx configuration for the prerendered (SSG) site.
#
# Deploy steps on the server (Ubuntu):
#   git pull
#   pnpm install
#   PORT=3000 BASE_PATH=/ pnpm --filter @workspace/bewe4r build     # writes artifacts/bewe4r/dist (see below)
#   pnpm --filter @workspace/api-server build  &&  restart the api-server
#   sudo nginx -t && sudo systemctl reload nginx
#
# The build produces:
#   dist/public/**/index.html     one real HTML file per page (content, meta tags and JSON-LD in the first response)
#   dist/public/404.html          the real 404 page
#   dist/public/admin/index.html  empty SPA shell for the admin panel (noindex)
#   dist/public/sitemap.xml       generated from the route list
#   dist/redirects.nginx.conf     generated 301s for duplicate URLs (included below)
#
# Adjust: server paths, ssl_certificate lines and the API port (api-server's PORT).

# 1) http -> https, bare domain -> www (one hop, 301)
server {
    listen 80;
    listen [::]:80;
    server_name bewe4r.com www.bewe4r.com;
    return 301 https://www.bewe4r.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bewe4r.com;

    ssl_certificate     /etc/letsencrypt/live/www.bewe4r.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bewe4r.com/privkey.pem;

    return 301 https://www.bewe4r.com$request_uri;
}

# 2) the site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bewe4r.com;

    ssl_certificate     /etc/letsencrypt/live/www.bewe4r.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bewe4r.com/privkey.pem;

    root /var/www/bewe4r/artifacts/bewe4r/dist/public;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    # Compression (brotli: also enable it if the nginx brotli module is installed)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # Duplicate URLs -> 301 to the real page (generated by the build)
    include /var/www/bewe4r/artifacts/bewe4r/dist/redirects.nginx.conf;

    # One URL per page: /blog/ -> /blog
    rewrite ^/(.+)/$ /$1 permanent;

    # API (Node). No bot blocking or rate limiting for crawlers on public pages.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;   # <- the api-server PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build files: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Other static files from /public (images, video, favicon, manifest)
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|mp4|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Admin panel: SPA shell, never indexed
    location = /admin {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /admin/index.html =404;
    }
    location ^~ /admin/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /admin/index.html;
    }

    # Pages: HTML must stay fresh so content updates go live immediately.
    # Unknown URL -> real 404 status with the 404 page (no soft-404).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
